name: 检查、打包与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 核心测试与双架构类型检查
        run: bash scripts/check.sh
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 检查发布标签与应用版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: 打包 Universal 应用
        run: bash scripts/package.sh
      - name: 签名并验证 Sparkle 更新
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/sign-appcast.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MouseGesture-universal
          path: |
            dist/MouseGesture-*-universal.zip
            dist/MouseGesture-*-universal.dmg
            dist/SHA256SUMS.txt
            dist/appcast.xml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MouseGesture-universal
          path: dist
      - name: 发布版本与安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          cd ..
          python3 scripts/release-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          # Keep latest/download/appcast.xml on the previous release until every new attachment is ready.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "MouseGesture $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" dist/MouseGesture-*-universal.zip dist/MouseGesture-*-universal.dmg dist/SHA256SUMS.txt dist/appcast.xml --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
