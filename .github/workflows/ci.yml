name: 检查、打包与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 核心测试与双架构类型检查
        run: bash scripts/check.sh
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 检查发布标签与应用版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: 打包 Universal 应用
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MouseGesture-universal
          path: |
            dist/MouseGesture-*-universal.zip
            dist/MouseGesture-*-universal.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MouseGesture-universal
          path: dist
      - name: 发布版本与安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" \
            dist/MouseGesture-*-universal.zip dist/MouseGesture-*-universal.dmg dist/SHA256SUMS.txt \
            --verify-tag --title "MouseGesture $GITHUB_REF_NAME" --notes-file CHANGELOG.md --latest
